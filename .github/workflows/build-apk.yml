name: Build Android APK from HTML

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.1

      - name: Create Android Project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/watchearn/testapp
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          cp index.html app/src/main/assets/index.html

          sudo apt-get update && sudo apt-get install -y imagemagick

          if [ ! -f "icon.png" ]; then
            convert -size 512x512 xc:"#050b1e" -fill "#38bdf8" -gravity center -pointsize 180 -annotate +0+0 "T" icon.png
          fi

          for size in 48:mdpi 72:hdpi 96:xhdpi 144:xxhdpi 192:xxxhdpi; do
            dim="${size%%:*}"
            folder="${size##*:}"
            convert icon.png -resize "${dim}x${dim}^" -gravity center -extent "${dim}x${dim}" PNG32:app/src/main/res/mipmap-${folder}/ic_launcher.png
            convert icon.png -resize "${dim}x${dim}^" -gravity center -extent "${dim}x${dim}" PNG32:app/src/main/res/mipmap-${folder}/ic_launcher_round.png
          done

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=35
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { 
                  google()
                  mavenCentral()
                  maven { url "https://ads.startappservice.com/android-sdk" }
              }
          }
          rootProject.name = "WatchEarnTest"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace "com.watchearn.testapp"
              compileSdk 35
              defaultConfig {
                  applicationId "com.watchearn.testapp"
                  minSdk 24
                  targetSdk 35
                  versionCode 6
                  versionName "1.5"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
          }
          dependencies {
              implementation "androidx.annotation:annotation:1.9.1"
              implementation "androidx.cardview:cardview:1.0.0"
              implementation "com.startapp:inapp-sdk:5.1.0"
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <application
                  android:allowBackup="true"
                  android:label="Watch &amp; Earn Test"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.NoTitleBar"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:icon="@mipmap/ic_launcher"
                      android:roundIcon="@mipmap/ic_launcher_round"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/watchearn/testapp/MainActivity.java <<'EOF'
          package com.watchearn.testapp;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.SslErrorHandler;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.Toast;
          import com.startapp.sdk.adsbase.StartAppAd;
          import com.startapp.sdk.adsbase.StartAppSDK;
          import com.startapp.sdk.adsbase.adlisteners.VideoListener;
          import com.startapp.sdk.adsbase.adlisteners.AdEventListener;
          import com.startapp.sdk.adsbase.Ad;
          import com.startapp.sdk.ads.banner.Banner;
          import com.startapp.sdk.ads.banner.BannerListener;

          public class MainActivity extends Activity {
              private WebView mainWebView;
              private StartAppAd videoRewardedAd;
              private StartAppAd interstitialAd;
              private Banner startAppBanner;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private static final String STARTIO_APP_ID = "206781301";
              private boolean isVideoReady = false;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  StartAppSDK.init(this, STARTIO_APP_ID, false);
                  StartAppSDK.setTestAdsEnabled(false);
                  StartAppAd.disableSplash();
                  
                  videoRewardedAd = new StartAppAd(this);
                  interstitialAd = new StartAppAd(this);

                  preloadVideo();
                  preloadInterstitial();

                  FrameLayout root = new FrameLayout(this);

                  int bHeight = (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, 60, getResources().getDisplayMetrics());

                  mainWebView = new WebView(this);
                  WebSettings s = mainWebView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  mainWebView.setWebChromeClient(new WebChromeClient());
                  mainWebView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onReceivedSslError(WebView view, SslErrorHandler handler, android.net.http.SslError error) {
                          handler.proceed();
                      }
                  });
                  mainWebView.addJavascriptInterface(new AdBridge(), "AndroidAd");
                  mainWebView.loadUrl("file:///android_asset/index.html");

                  FrameLayout.LayoutParams wp = new FrameLayout.LayoutParams(-1, -1);
                  wp.bottomMargin = bHeight;
                  root.addView(mainWebView, wp);

                  startAppBanner = new Banner(this, new BannerListener() {
                      @Override
                      public void onReceiveAd(View bannerView) {
                          bannerView.setVisibility(View.VISIBLE);
                      }

                      @Override
                      public void onFailedToReceiveAd(View bannerView) {
                          handler.postDelayed(() -> {
                              if (startAppBanner != null) {
                                  startAppBanner.loadAd();
                              }
                          }, 15000);
                      }

                      @Override
                      public void onClick(View bannerView) {}

                      @Override
                      public void onImpression(View bannerView) {}
                  });

                  FrameLayout.LayoutParams bp = new FrameLayout.LayoutParams(-1, bHeight);
                  bp.gravity = Gravity.BOTTOM;
                  root.addView(startAppBanner, bp);

                  setContentView(root);
              }

              private void preloadVideo() {
                  isVideoReady = false;
                  videoRewardedAd.loadAd(StartAppAd.AdMode.REWARDED_VIDEO, new AdEventListener() {
                      @Override
                      public void onReceiveAd(Ad ad) {
                          isVideoReady = true;
                      }
                      @Override
                      public void onFailedToReceiveAd(Ad ad) {
                          isVideoReady = false;
                      }
                  });
              }

              private void preloadInterstitial() {
                  interstitialAd.loadAd(StartAppAd.AdMode.AUTOMATIC, new AdEventListener() {
                      @Override
                      public void onReceiveAd(Ad ad) {}
                      @Override
                      public void onFailedToReceiveAd(Ad ad) {}
                  });
              }

              public class AdBridge {
                  @JavascriptInterface
                  public void showRewarded() {
                      runOnUiThread(() -> {
                          if (isVideoReady) {
                              videoRewardedAd.setVideoListener(new VideoListener() {
                                  @Override
                                  public void onVideoCompleted() {
                                      handler.post(() -> {
                                          if (mainWebView != null) {
                                              mainWebView.evaluateJavascript("if(window.adMobRewardEarned){window.adMobRewardEarned();}", null);
                                          }
                                      });
                                  }
                              });
                              videoRewardedAd.showAd();
                              preloadVideo();
                          } else {
                              Toast.makeText(MainActivity.this, "Buffering reward video, please wait 5s...", Toast.LENGTH_SHORT).show();
                              videoRewardedAd.loadAd(StartAppAd.AdMode.REWARDED_VIDEO, new AdEventListener() {
                                  @Override
                                  public void onReceiveAd(Ad ad) {
                                      isVideoReady = true;
                                      videoRewardedAd.showAd();
                                      preloadVideo();
                                  }
                                  @Override
                                  public void onFailedToReceiveAd(Ad ad) {
                                      Toast.makeText(MainActivity.this, "Video inventory busy. Try in 10s.", Toast.LENGTH_SHORT).show();
                                  }
                              });
                          }
                      });
                  }

                  @JavascriptInterface
                  public void showInterstitial() {
                      runOnUiThread(() -> {
                          interstitialAd.showAd();
                          preloadInterstitial();
                      });
                  }
              }

              @Override
              protected void onDestroy() {
                  if (mainWebView != null) mainWebView.destroy();
                  super.onDestroy();
              }

              @Override
              public void onBackPressed() {
                  if (mainWebView != null && mainWebView.canGoBack()) mainWebView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

      - name: Build Release APK
        shell: bash
        run: |
          set -e
          gradle wrapper --gradle-version 8.2.1 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK
        shell: bash
        run: |
          set -e
          mkdir -p apk-output
          cp app/build/outputs/apk/release/app-release.apk apk-output/WatchEarn-Test.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WatchEarn-Test-APK
          path: apk-output/WatchEarn-Test.apk
          if-no-files-found: error
