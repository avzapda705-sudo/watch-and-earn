name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Initialize Platform & Build APK
        run: |
          if [ ! -f "config.xml" ]; then
            cordova create temp_app com.app.watchandearn WatchAndEarn
            cp -r * temp_app/www/ 2>/dev/null || true
            cd temp_app
          fi
          cordova platform add android || true
          cordova build android --debug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WatchAndEarn-Test-APK
          path: |
            platforms/android/app/build/outputs/apk/debug/*.apk
            temp_app/platforms/android/app/build/outputs/apk/debug/*.apk
