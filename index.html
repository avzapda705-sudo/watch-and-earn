<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Watch & Earn</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .header {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      margin-bottom: 25px;
    }
    .coin-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f59e0b;
      color: #000;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 16px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: #1e293b;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
      margin-bottom: 80px;
    }
    h2 {
      font-size: 20px;
      text-align: center;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.1s ease;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-reward {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
    }
    .btn-interstitial {
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: white;
    }
    .btn-claim {
      background: #64748b;
      color: white;
    }
    #ad-container {
      width: 100%;
      display: flex;
      justify-content: center;
      position: fixed;
      bottom: 0;
      left: 0;
      background: #0f172a;
      z-index: 999;
    }
  </style>

  <!-- Start.io Integration Script -->
  <script>
    window.startIoAppId = "206781301";
  </script>
  <script src="https://ads.startappservice.com/js/startapp-tag.js"></script>
</head>
<body>

  <!-- Top Header with Coin Counter -->
  <div class="header">
    <h3>Watch & Earn</h3>
    <div class="coin-badge">
      <span>🪙</span>
      <span id="coin-balance">0</span>
    </div>
  </div>

  <!-- Task Card -->
  <div class="card">
    <h2>Daily Rewards & Tasks</h2>
    
    <!-- Rewarded Video Ad Button -->
    <button class="btn btn-reward" onclick="handleWatchRewardedAd()">
      <span>📺</span> Watch Video Ad (+10 Coins)
    </button>

    <!-- Interstitial Ad Button -->
    <button class="btn btn-interstitial" onclick="handleShowInterstitialAd()">
      <span>⚡</span> Next Task (+2 Coins)
    </button>

    <!-- Claim Reward Bonus -->
    <button class="btn btn-claim" onclick="claimDailyBonus()">
      <span>🎁</span> Claim Daily Bonus (+5 Coins)
    </button>
  </div>

  <!-- Bottom Banner Space -->
  <div id="ad-container"></div>

  <script>
    // 1. Initial Load & Balance Display
    document.addEventListener("DOMContentLoaded", function () {
      updateDisplay();
      initStartIo();
    });

    function getCoins() {
      return parseInt(localStorage.getItem("watch_earn_coins") || "0");
    }

    function addCoins(amount) {
      const current = getCoins() + amount;
      localStorage.setItem("watch_earn_coins", current);
      updateDisplay();
    }

    function updateDisplay() {
      document.getElementById("coin-balance").innerText = getCoins();
    }

    // 2. Initialize Start.io Ads
    function initStartIo() {
      if (window.startapp) {
        // Load Bottom Banner Ad
        startapp.loadBanner({
          container: "ad-container",
          position: "BOTTOM",
          autoShow: true
        });

        // Preload Fullscreen Ad
        startapp.loadInterstitial();
      }
    }

    // 3. Show Rewarded Ad
    function handleWatchRewardedAd() {
      if (window.startapp) {
        startapp.loadRewardedVideo({
          onLoaded: function () {
            startapp.showRewardedVideo();
          },
          onRewarded: function () {
            addCoins(10);
            alert("Success! You earned +10 Coins.");
          },
          onError: function (err) {
            console.error("Rewarded Ad Error:", err);
            alert("Ad is not ready right now. Please try again later.");
          }
        });
      } else {
        alert("Ad network is connecting. Please retry in a few seconds.");
      }
    }

    // 4. Show Interstitial Ad
    function handleShowInterstitialAd() {
      if (window.startapp) {
        startapp.showInterstitial();
        addCoins(2);
        // Preload next interstitial ad
        startapp.loadInterstitial();
      } else {
        alert("Ad is loading, please wait...");
      }
    }

    // 5. Daily Bonus
    function claimDailyBonus() {
      addCoins(5);
      alert("Bonus collected: +5 Coins added!");
    }
  </script>
</body>
</html>
